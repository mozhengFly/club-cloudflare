name: 每日签到

on:
  # 每天北京时间 06:00 执行（UTC+8，对应 UTC 前一天 22:00）
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

# 需要配置的 Secrets（Settings -> Secrets and variables -> Actions）：
#   LOGIN_ENC_URL          加密 login.enc 文件的下载地址（必填）
#   AES_PASSWORD           解密 login.enc 所用的 AES 密码（必填）
#   API_BASE               Cloudflare 接口地址（必填，敏感信息只在环境变量中配置）
#   CLOUDFLARE_SHARED_KEY  Cloudflare API 共享秘钥，64 位 hex（必填）
#   ACCOUNT_AES_KEY        账号配置加密密钥（可选，默认为 login.py 内置密钥）
jobs:
  sign-in:
    # Ubuntu 24.04 不再提供 Python 3.8，需使用 22.04
    runs-on: ubuntu-22.04
    env:
      API_BASE: ${{ secrets.API_BASE }}
      CLOUDFLARE_SHARED_KEY: ${{ secrets.CLOUDFLARE_SHARED_KEY }}
      ACCOUNT_AES_KEY: ${{ secrets.ACCOUNT_AES_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打印执行服务器 IP
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || curl -s --max-time 10 https://ifconfig.me/ip)
          echo "当前执行任务服务器 IP: ${IP:-获取失败}"

      - name: 清理旧的 login.py
        run: rm -f src/login.py

      - name: 下载并解密 login
        env:
          LOGIN_ENC_URL: ${{ secrets.LOGIN_ENC_URL }}
          AES_PASSWORD: ${{ secrets.AES_PASSWORD }}
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: python src/download_and_decrypt.py

      - name: 执行签到并上传结果
        run: python src/main.py

      - name: 打印签到结果
        run: python src/print_sign_result.py